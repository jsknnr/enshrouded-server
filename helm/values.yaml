image:
  repository: sknnr/enshrouded-dedicated-server
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  externalIPs: []
  annotations: {}
  # -- Extra labels for the service (e.g. for a Cilium L2 announcement or MetalLB selector)
  labels: {}

resources:
  requests:
    memory: 12G
    cpu: 4.0

volumes:
  dataPVC:
    # -- Size of the persistent volume
    size: 50Gi
    # -- Extra labels for the data PVC (e.g. to exclude it from or include it in backups)
    labels: {}
  serverFilesPVC:
    # -- Store the downloaded server files (~8 GB) on a persistent volume mounted at /home/steam/enshrouded,
    # so they are not downloaded again on every pod restart. SteamCMD then only validates and fetches updates.
    enabled: false
    # -- Size of the server files volume
    size: 30Gi
    # -- Use an existing PVC for the server files instead of creating one
    existingClaim: ""
    # -- Extra labels for the server files PVC (e.g. to exclude it from backups, the files can always be downloaded again)
    labels: {}
  storageClassName: ""

config:
  # -- Server name
  serverName: "Enshrouded Server"
  # -- Server password. If not set, password will be generated randomly.
  serverPassword: ""
  # -- Existing secret name for server password. Must contain key named "password". If set `serverPassword` will be ignored.
  serverPasswordExistingSecretName: ""
  port: 15637
  steamPort: 27015
  # -- Number of server slots
  serverSlots: 16
  externalConfig: 0
