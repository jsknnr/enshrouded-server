version: '3'
services:
  enshrouded:
    container_name: 'enshrouded-server'
    # To build the image from this repo instead of pulling it, replace the
    # image line below with "build: ." and run "docker compose up -d --build".
    image: sknnr/enshrouded-dedicated-server:latest
    ports:
      - "15637:15637/udp"
      - "27015:27015/udp"
    environment:
      - SERVER_NAME=Enshrouded Containerized
      - SERVER_PASSWORD=PleaseChangeMe
      - PORT=15637
      - SERVER_SLOTS=16
      - SERVER_IP=0.0.0.0
    volumes:
      - enshrouded-persistent-data:/home/steam/enshrouded/savegame
    restart: unless-stopped
    
volumes:
  enshrouded-persistent-data:
